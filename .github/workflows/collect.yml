name: Collect Releases

on:
  schedule:
    - cron: '0 6 * * *'   # каждый день в 6:00 UTC
  workflow_dispatch:       # ручной запуск

concurrency:
  group: collect-releases
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run collector
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN_POLUHOVAMARIA_TECH: ${{ secrets.TOKEN_POLUHOVAMARIA_TECH }}
          TOKEN_WISNAKEX: ${{ secrets.TOKEN_WISNAKEX }}
        run: python scripts/collect.py

      - name: Commit changes
        run: |
          cp catalog.json docs/catalog.json
          git config user.name "TPK Collector"
          git config user.email "collector@kbTPKsteel.github"
          git add catalog.json docs/
          git diff --staged --quiet || git commit -m "Update catalog [$(date -u +%Y-%m-%d)]"
          git pull --rebase
          git push
