# -------------------------------------------------------
# Этот файл описывает продукт для каталога TPK.
# Добавь его в корень своего репозитория.
# Заполни все поля на русском или английском языке.
# -------------------------------------------------------

# Название продукта
name: Название продукта

# Тип продукта — выбери одно из четырёх:
#   app    — приложение (.exe), компилируется под версии Tekla
#   plugin — плагин (.dll), компилируется под версии Tekla
#   macro  — макрос (.cs), не зависит от версии Tekla
#   other  — прочие инструменты (шаблоны, таблицы, утилиты и т.п.)
type: app

# Краткое описание (1–3 предложения)
description: |
  Что делает этот продукт и для чего он нужен.
  Описание вставляется прямо вместо этого текста.

# Картинка — путь к файлу в репо (например: assets/preview.png)
# или внешняя ссылка (https://...)
image: assets/preview.png

# Ссылка на видео-демонстрацию (YouTube, необязательно)
# video: https://youtube.com/watch?v=...

# Правила именования файлов в релизе:
#
# Для type: macro и type: other —
#   называй файлы как угодно, в каталог попадут все прикреплённые файлы.
#
# Для type: app и type: plugin —
#   загружай отдельный файл (или архив) для каждой версии Tekla.
#   Версия Tekla определяется автоматически по имени файла.
#   Главное — чтобы в имени было слово Tekla и сразу за ним год (4 цифры):
#
#     MyPlugin_Tekla2020.dll      — отдельный файл
#     MyPlugin_Tekla2024.dll
#
#     MyPlugin_Tekla2020.zip      — архив с несколькими файлами (приоритет над dll/exe)
#     MyPlugin_Tekla2024.zip
#
#   Поддерживаемые форматы архивов: .zip, .7z, .rar, .gz, .tar
#   Если ни одного подходящего файла нет — релиз будет пропущен.

# Инструкция для пользователей (поддерживает Markdown)
instructions: |
  ## Установка
  1. Скачать файл из раздела версий
  2. ...

  ## Использование
  ...
