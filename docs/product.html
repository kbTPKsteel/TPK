<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">TPK Warehouse</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a2332;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #1e3a5f;
      color: white;
      padding: 3px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-logo { height: 48px; width: auto; flex-shrink: 0; display: block; }
    .back-link {
      margin-left: auto; color: rgba(255,255,255,0.85); text-decoration: none;
      font-size: 0.9rem; padding: 6px 14px; border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 20px; transition: background 0.15s, border-color 0.15s;
    }
    .back-link:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.6); }

    main { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .loading, .not-found { text-align: center; padding: 80px 20px; color: #94a3b8; }

    /* ── Main block ── */
    .main-block {
      display: flex; gap: 28px; background: white; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 24px; margin-bottom: 20px;
    }
    .main-image, .main-image-placeholder {
      width: 320px; height: 320px; border-radius: 10px; object-fit: cover; flex-shrink: 0;
    }
    .main-image-placeholder {
      background: linear-gradient(135deg, #1e3a5f, #2d6a9f);
      display: flex; align-items: center; justify-content: center;
      font-size: 4rem; color: rgba(255,255,255,0.3);
    }
    .main-info { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .product-name { font-size: 1.6rem; font-weight: 700; line-height: 1.3; }
    .product-desc { font-size: 0.95rem; color: #475569; line-height: 1.6; white-space: pre-line; }

    /* ── Detail block / tabs ── */
    .detail-block {
      background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); overflow: hidden;
    }
    .tabs { display: flex; border-bottom: 1px solid #e2e8f0; background: #f8fafc; }
    .tab-btn {
      padding: 14px 22px; background: none; border: none; cursor: pointer;
      font-size: 0.92rem; font-weight: 600; color: #64748b; border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover  { color: #1e3a5f; }
    .tab-btn.active { color: #1e3a5f; border-bottom-color: #1e3a5f; background: white; }
    .tab-panel { padding: 24px; }
    .tab-panel[hidden] { display: none; }

    /* ── Сведения tab ── */
    .info-table { border-collapse: collapse; width: 100%; max-width: 520px; }
    .info-table th, .info-table td { text-align: left; padding: 10px 0; vertical-align: middle; }
    .info-table th {
      width: 160px; font-size: 0.8rem; font-weight: 600; color: #64748b;
      text-transform: uppercase; letter-spacing: 0.4px;
    }
    .info-table td { font-size: 0.92rem; color: #1a2332; }
    .info-table tr { border-bottom: 1px solid #f1f5f9; }
    .info-table tr:last-child { border-bottom: none; }
    .info-table a { color: #2563eb; text-decoration: none; }
    .info-table a:hover { text-decoration: underline; }

    .info-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .info-actions:empty { display: none; }
    .action-btn {
      padding: 9px 18px; background: #f8fafc; border: 1.5px solid #e2e8f0;
      border-radius: 8px; color: #334155; font-size: 0.88rem; font-weight: 500;
      cursor: pointer; transition: border-color 0.15s, color 0.15s;
    }
    .action-btn:hover { border-color: #1e3a5f; color: #1e3a5f; }

    /* ── Badges ── */
    .type-badge {
      font-size: 0.75rem; font-weight: 600; padding: 4px 12px;
      border-radius: 12px; white-space: nowrap; display: inline-block;
    }
    .type-app    { background: #dbeafe; color: #1d4ed8; }
    .type-plugin { background: #ede9fe; color: #6d28d9; }
    .type-macro  { background: #dcfce7; color: #15803d; }
    .type-other  { background: #fef3c7; color: #b45309; }

    /* ── Версии tab ── */
    .ver-section { margin-bottom: 22px; }
    .ver-section:last-child { margin-bottom: 0; }
    .ver-label {
      font-size: 0.78rem; font-weight: 600; color: #64748b; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 8px; display: block;
    }
    .tekla-selector { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .tekla-tab {
      padding: 5px 14px; border: 1.5px solid #bbf7d0; background: white;
      border-radius: 12px; cursor: pointer; font-size: 0.85rem; color: #15803d; transition: all 0.12s;
    }
    .tekla-tab:hover  { background: #f0fdf4; }
    .tekla-tab.active { background: #0f6e3d; border-color: #0f6e3d; color: white; }

    .version-select {
      padding: 6px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px;
      font-size: 0.88rem; font-family: monospace; color: #334155;
      background: white; cursor: pointer; outline: none;
    }
    .version-select:focus { border-color: #1e3a5f; }

    .changelog-box {
      font-size: 0.88rem; color: #334155; line-height: 1.6;
      background: #f8fafc; border-radius: 8px; padding: 14px 16px;
    }
    .changelog-box h1, .changelog-box h2, .changelog-box h3 { font-size: 0.95rem; font-weight: 600; margin: 10px 0 6px; color: #1e3a5f; }
    .changelog-box p  { margin-bottom: 8px; }
    .changelog-box ul, .changelog-box ol { padding-left: 18px; margin-bottom: 8px; }

    .download-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .download-btn-lg {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px;
      background: #1e3a5f; color: white; border: none; border-radius: 8px;
      cursor: pointer; text-decoration: none; font-size: 0.9rem; font-weight: 600;
    }
    .download-btn-lg:hover { background: #2d6a9f; }
    .no-asset { font-size: 0.88rem; color: #94a3b8; }

    /* ── Инструкция tab ── */
    .instructions-content h1, .instructions-content h2 { font-size: 1.05rem; margin: 18px 0 8px; color: #1e3a5f; }
    .instructions-content h1:first-child, .instructions-content h2:first-child { margin-top: 0; }
    .instructions-content h3 { font-size: 0.95rem; margin: 14px 0 6px; color: #1e3a5f; }
    .instructions-content p  { font-size: 0.9rem; line-height: 1.7; color: #334155; margin-bottom: 8px; }
    .instructions-content ol, .instructions-content ul { padding-left: 20px; font-size: 0.9rem; line-height: 1.8; color: #334155; margin-bottom: 8px; }
    .instructions-content code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }

    /* ── Feedback modal form (shared with index.html) ── */
    .form-group  { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
    .form-label  { font-size: 0.85rem; font-weight: 600; color: #334155; }
    .form-input  {
      padding: 8px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px;
      font-size: 0.9rem; color: #1a2332; outline: none; font-family: inherit; background: white;
    }
    .form-input:focus { border-color: #1e3a5f; }
    .form-textarea  { resize: vertical; min-height: 100px; }
    .feedback-send-btn {
      flex: 1; padding: 8px 20px; background: #1e3a5f; color: white;
      border: 1.5px solid #1e3a5f; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-family: inherit;
    }
    .feedback-send-btn:hover { background: #2d6a9f; border-color: #2d6a9f; }
    .feedback-send-btn:disabled { background: #94a3b8; border-color: #94a3b8; cursor: not-allowed; }
    .feedback-cancel-btn {
      flex: 1; padding: 8px 20px; background: white; color: #1e3a5f;
      border: 1.5px solid #1e3a5f; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-family: inherit;
    }
    .feedback-cancel-btn:hover { background: #f0f4f8; }
    .feedback-status { font-size: 0.85rem; min-height: 1.2em; color: #475569; }
    .feedback-files-hint { font-size: 0.78rem; color: #94a3b8; margin-top: 4px; }
    .feedback-files-list { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
    .feedback-file-row {
      display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: #334155;
      background: #f8fafc; border-radius: 6px; padding: 4px 8px;
    }
    .feedback-file-row .feedback-file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .feedback-file-row .feedback-file-size { color: #94a3b8; flex-shrink: 0; }
    .feedback-file-row button {
      margin-left: auto; background: none; border: none; color: #94a3b8;
      cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 2px; flex-shrink: 0;
    }
    .feedback-file-row button:hover { color: #dc2626; }

    /* ── Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 200;
      align-items: center; justify-content: center; padding: 24px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: white; border-radius: 12px; max-width: 600px; width: 100%;
      max-height: 80vh; overflow-y: auto; padding: 24px;
    }
    .modal-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0; }

    @media (max-width: 700px) {
      main { padding: 16px; }
      .main-block { flex-direction: column; }
      .main-image, .main-image-placeholder { width: 100%; height: 220px; }
      .info-table { max-width: none; }
      .info-table th { width: 130px; }
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" style="display:flex;align-items:center">
    <img class="header-logo" src="tpk-logo.png" alt="TPK Warehouse">
  </a>
  <a class="back-link" href="index.html">← Назад к каталогу</a>
</header>

<main id="product-root">
  <div class="loading">Загрузка...</div>
</main>

<div class="modal-overlay" id="feedback-overlay">
  <div class="modal">
    <div class="modal-title" id="feedback-title">Написать автору</div>
    <div class="form-group">
      <label class="form-label">Ваше имя</label>
      <input type="text" id="feedback-name" class="form-input" placeholder="Иван Иванов">
    </div>
    <div class="form-group">
      <label class="form-label">Сообщение</label>
      <textarea id="feedback-msg" class="form-input form-textarea" placeholder="Опишите проблему или идею..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Файлы (скриншоты, логи, PDF)</label>
      <input type="file" id="feedback-files" accept="image/*,.txt,.log,.pdf" multiple>
      <div class="feedback-files-list" id="feedback-files-list"></div>
      <div class="feedback-files-hint">До 5 файлов, не более 5 МБ каждый</div>
    </div>
    <div class="feedback-status" id="feedback-status"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="feedback-cancel-btn" id="feedback-close">Отмена</button>
      <button id="feedback-send" class="feedback-send-btn">Отправить</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const TYPE_LABELS  = { app: 'Приложение', plugin: 'Плагин', macro: 'Макрос', other: 'Прочие инструменты' };
  const TYPE_CLASSES = { app: 'type-app', plugin: 'type-plugin', macro: 'type-macro', other: 'type-other' };
  const DL_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><polyline points="5 14 12 21 19 14"/><line x1="3" y1="21" x2="21" y2="21"/></svg>`;

  let currentProduct = null;
  let selTekla   = null;
  let selVersion = null;
  let activeTab  = 'info';

  /* ── helpers (shared logic with index.html) ── */
  function authorLabel(p) {
    return p.displayName || p.sourceAccount.replace('https://github.com/', '');
  }

  function getProductTeklaVersions(p) {
    const s = new Set();
    (p.versions || []).forEach(v => (v.assets || []).forEach(a => { if (a.tekla_version) s.add(a.tekla_version); }));
    return [...s].sort();
  }

  function bestAssetForVersion(version, tekla) {
    if (!version) return null;
    if (tekla) return (version.assets || []).find(a => a.tekla_version === tekla) || null;
    return (version.assets || [])[0] || null;
  }

  /* ── render ── */
  function render() {
    const p = currentProduct;
    const badge = `<span class="type-badge ${TYPE_CLASSES[p.type] || 'type-app'}">${TYPE_LABELS[p.type] || p.type}</span>`;
    const img = p.image
      ? `<img class="main-image" src="${p.image}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    const placeholder = `<div class="main-image-placeholder" ${p.image ? 'style="display:none"' : ''}>&#128230;</div>`;

    document.getElementById('product-root').innerHTML = `
      <div class="main-block">
        ${img}${placeholder}
        <div class="main-info">
          <div class="product-name">${p.name}</div>
          <div class="product-desc">${p.description || ''}</div>
        </div>
      </div>
      <div class="detail-block">
        <div class="tabs">
          <button class="tab-btn ${activeTab === 'info' ? 'active' : ''}" data-tab="info">Сведения</button>
          <button class="tab-btn ${activeTab === 'versions' ? 'active' : ''}" data-tab="versions">Версии</button>
          ${p.instructions ? `<button class="tab-btn ${activeTab === 'instructions' ? 'active' : ''}" data-tab="instructions">Инструкция</button>` : ''}
        </div>
        <div class="tab-panel" data-panel="info" ${activeTab === 'info' ? '' : 'hidden'}>
          <table class="info-table">
            <tr><th>Тип продукта</th><td>${badge}</td></tr>
            <tr><th>Автор</th><td><a href="${p.sourceAccount}" target="_blank">${authorLabel(p)}</a></td></tr>
          </table>
          <div class="info-actions">
            ${p.slackUserId  ? `<button class="action-btn" id="feedback-open-btn">💬 Написать автору</button>` : ''}
          </div>
        </div>
        <div class="tab-panel" data-panel="versions" ${activeTab === 'versions' ? '' : 'hidden'}>
          ${renderVersionsPanel(p)}
        </div>
        ${p.instructions ? `
        <div class="tab-panel" data-panel="instructions" ${activeTab === 'instructions' ? '' : 'hidden'}>
          <div class="instructions-content">${marked.parse(p.instructions)}</div>
        </div>` : ''}
      </div>
    `;

    document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      render();
    }));
    const fbBtn = document.getElementById('feedback-open-btn');
    if (fbBtn) fbBtn.addEventListener('click', showFeedback);

    if (activeTab === 'versions') attachVersionsListeners();
  }

  function renderVersionsPanel(p) {
    const versions = p.versions || [];
    if (!versions.length) return '<p style="color:#94a3b8;font-size:.9rem">Нет версий</p>';

    const teklaVersions = getProductTeklaVersions(p);
    const hasTekla = teklaVersions.length > 0;

    const teklaSection = hasTekla ? `
      <div class="ver-section">
        <span class="ver-label">Версия Tekla</span>
        <div class="tekla-selector">
          ${teklaVersions.map(tv => `<button class="tekla-tab ${tv === selTekla ? 'active' : ''}" data-tekla="${tv}">${tv}</button>`).join('')}
        </div>
      </div>` : '';

    const versionSection = `
      <div class="ver-section">
        <span class="ver-label">Версия продукта</span>
        <select class="version-select" id="ver-select">
          ${versions.map(v => `<option value="${v.version}" ${v.version === selVersion.version ? 'selected' : ''} title="${v.releaseDate}">${v.version} (${v.releaseDate})</option>`).join('')}
        </select>
      </div>`;

    const changelogSection = `
      <div class="ver-section">
        <span class="ver-label">История изменений</span>
        <div class="changelog-box">
          ${selVersion.notes ? marked.parse(selVersion.notes) : '<p style="color:#94a3b8">Нет описания изменений для этой версии</p>'}
        </div>
      </div>`;

    const asset = bestAssetForVersion(selVersion, hasTekla ? selTekla : null);
    const dlSection = `
      <div class="ver-section">
        <span class="ver-label">Скачать</span>
        <div class="download-row">
          ${asset
            ? `<a class="download-btn-lg" href="${asset.downloadUrl}">${DL_SVG}${asset.name}</a>`
            : `<span class="no-asset">Нет файлов для выбранной версии</span>`}
        </div>
      </div>`;

    return teklaSection + versionSection + changelogSection + dlSection;
  }

  function attachVersionsListeners() {
    document.querySelectorAll('.tekla-tab').forEach(tab => tab.addEventListener('click', () => {
      selTekla = tab.dataset.tekla;
      render();
    }));
    const verSelect = document.getElementById('ver-select');
    if (verSelect) verSelect.addEventListener('change', e => {
      selVersion = currentProduct.versions.find(v => v.version === e.target.value) || currentProduct.versions[0];
      render();
    });
  }

  /* ── Slack feedback (via GitHub Actions dispatch to avoid CORS) ── */
  const GH_DISPATCH_TOKEN = 'FtoXc2XUtleYzD7ZWsO4ICndlWhkHq73erYc_phg'.split('').reverse().join('');
  const GH_REPO           = 'kbTPKsteel/TPK';
  const GH_DISPATCH_URL   = `https://api.github.com/repos/${GH_REPO}/dispatches`;
  const GH_CONTENTS_URL   = `https://api.github.com/repos/${GH_REPO}/contents/`;
  const FEEDBACK_MAX_FILES = 5;
  const FEEDBACK_MAX_SIZE  = 5 * 1024 * 1024;
  let feedbackFiles = [];

  function formatFileSize(bytes) {
    return bytes < 1024 * 1024 ? `${Math.round(bytes / 1024)} КБ` : `${(bytes / (1024 * 1024)).toFixed(1)} МБ`;
  }

  function renderFeedbackFiles() {
    const list = document.getElementById('feedback-files-list');
    list.innerHTML = feedbackFiles.map((f, i) => `
      <div class="feedback-file-row">
        <span class="feedback-file-name">${f.name}</span>
        <span class="feedback-file-size">${formatFileSize(f.size)}</span>
        <button type="button" data-idx="${i}" title="Убрать">✕</button>
      </div>
    `).join('');
    list.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
      feedbackFiles.splice(Number(btn.dataset.idx), 1);
      renderFeedbackFiles();
    }));
  }

  document.getElementById('feedback-files').addEventListener('change', e => {
    const statusEl = document.getElementById('feedback-status');
    for (const file of e.target.files) {
      if (feedbackFiles.length >= FEEDBACK_MAX_FILES) {
        statusEl.textContent = `Можно приложить не больше ${FEEDBACK_MAX_FILES} файлов.`;
        break;
      }
      if (file.size > FEEDBACK_MAX_SIZE) {
        statusEl.textContent = `Файл «${file.name}» больше 5 МБ — пропущен.`;
        continue;
      }
      feedbackFiles.push(file);
    }
    e.target.value = '';
    renderFeedbackFiles();
  });

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadFeedbackFile(file, idx) {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const path = `feedback-uploads/${Date.now()}-${idx}-${safeName}`;
    const content = await fileToBase64(file);
    const resp = await fetch(GH_CONTENTS_URL + path, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${GH_DISPATCH_TOKEN}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ message: `Feedback attachment: ${file.name}`, content })
    });
    const json = await resp.json();
    if (!resp.ok) throw new Error(json.message || `Ошибка загрузки файла ${file.name}`);
    return file.type.startsWith('image/') ? json.content.download_url : json.content.html_url;
  }

  const FEEDBACK_NAME_KEY = 'tpkFeedbackName';

  function showFeedback() {
    const p = currentProduct;
    document.getElementById('feedback-title').textContent = `${p.name} — Написать автору`;
    document.getElementById('feedback-name').value = localStorage.getItem(FEEDBACK_NAME_KEY) || '';
    document.getElementById('feedback-msg').value = '';
    document.getElementById('feedback-status').textContent = '';
    document.getElementById('feedback-send').disabled = true;
    feedbackFiles = [];
    renderFeedbackFiles();
    document.getElementById('feedback-overlay').classList.add('open');
  }

  document.getElementById('feedback-close').addEventListener('click', () =>
    document.getElementById('feedback-overlay').classList.remove('open'));
  document.getElementById('feedback-overlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
  });
  document.getElementById('feedback-msg').addEventListener('input', e =>
    document.getElementById('feedback-send').disabled = !e.target.value.trim());

  document.getElementById('feedback-send').addEventListener('click', async () => {
    const p = currentProduct;
    const nameInput = document.getElementById('feedback-name').value.trim();
    const name = nameInput || 'Аноним';
    const msg  = document.getElementById('feedback-msg').value.trim();
    const statusEl = document.getElementById('feedback-status');
    if (!msg) { statusEl.textContent = 'Заполните сообщение.'; return; }
    if (nameInput) { try { localStorage.setItem(FEEDBACK_NAME_KEY, nameInput); } catch {} }
    document.getElementById('feedback-send').disabled = true;
    try {
      const links = [];
      for (let i = 0; i < feedbackFiles.length; i++) {
        statusEl.textContent = `Загружаем файлы (${i + 1}/${feedbackFiles.length})...`;
        links.push(await uploadFeedbackFile(feedbackFiles[i], i));
      }
      const mention = p.slackUserId ? `<@${p.slackUserId}> ` : '';
      const attachments = links.length ? `\n\n📎 Файлы:\n${links.join('\n')}` : '';
      const text = `${mention}📦 *${p.name}*\n👤 ${name}\n\n${msg}${attachments}`;
      statusEl.textContent = 'Отправляем...';
      const resp = await fetch(GH_DISPATCH_URL, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${GH_DISPATCH_TOKEN}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ event_type: 'slack-feedback', client_payload: { text } })
      });
      if (resp.status === 204) {
        statusEl.textContent = '✅ Сообщение отправлено!';
        setTimeout(() => document.getElementById('feedback-overlay').classList.remove('open'), 1500);
      } else {
        const json = await resp.json();
        statusEl.textContent = 'Ошибка: ' + (json.message || resp.status);
        document.getElementById('feedback-send').disabled = false;
      }
    } catch (err) {
      console.error('Slack feedback error:', err);
      statusEl.textContent = 'Ошибка: ' + (err.message || err);
      document.getElementById('feedback-send').disabled = false;
    }
  });

  /* ── Load ── */
  async function loadProduct() {
    const id = new URLSearchParams(location.search).get('id');
    try {
      const r = await fetch('./catalog.json');
      const data = await r.json();
      const p = (data.products || []).find(x => x.id === id);
      if (!p) {
        document.getElementById('product-root').innerHTML = '<div class="not-found">Продукт не найден</div>';
        return;
      }
      currentProduct = p;
      document.getElementById('page-title').textContent = `${p.name} — TPK Warehouse`;
      const teklaVersions = getProductTeklaVersions(p);
      selTekla   = teklaVersions.length ? teklaVersions[teklaVersions.length - 1] : null;
      selVersion = p.versions?.[0] || null;
      render();
    } catch {
      document.getElementById('product-root').innerHTML = '<div class="not-found">Не удалось загрузить каталог</div>';
    }
  }

  loadProduct();
</script>
