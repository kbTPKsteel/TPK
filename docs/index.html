<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPK — Каталог приложений</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a2332;
      min-height: 100vh;
    }

    header {
      background: #1e3a5f;
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 { font-size: 1.4rem; font-weight: 700; flex-shrink: 0; }

    .search-wrap { flex: 1; max-width: 400px; margin-left: auto; }

    #search {
      width: 100%;
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      font-size: 0.95rem;
      background: rgba(255,255,255,0.15);
      color: white;
      outline: none;
    }
    #search::placeholder { color: rgba(255,255,255,0.55); }
    #search:focus { background: rgba(255,255,255,0.25); }

    .filters {
      display: flex;
      gap: 8px;
      padding: 14px 24px;
      background: white;
      border-bottom: 1px solid #e2e8f0;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 18px;
      border: 2px solid #cbd5e1;
      background: white;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.88rem;
      color: #475569;
      transition: all 0.15s;
    }
    .filter-btn:hover { border-color: #1e3a5f; color: #1e3a5f; }
    .filter-btn.active { background: #1e3a5f; border-color: #1e3a5f; color: white; }

    main {
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .meta-bar {
      text-align: right;
      font-size: 0.78rem;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex;
      flex-direction: column;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }

    .card-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-image-placeholder {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, #1e3a5f, #2d6a9f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: rgba(255,255,255,0.3);
    }

    .card-body {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }

    .card-name { font-size: 1.05rem; font-weight: 600; line-height: 1.3; }

    .type-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .type-app    { background: #dbeafe; color: #1d4ed8; }
    .type-plugin { background: #ede9fe; color: #6d28d9; }
    .type-macro  { background: #dcfce7; color: #15803d; }

    .card-desc {
      font-size: 0.88rem;
      color: #475569;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-source { font-size: 0.82rem; color: #94a3b8; }
    .card-source a { color: #2563eb; text-decoration: none; }
    .card-source a:hover { text-decoration: underline; }

    .versions-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .versions-list { display: flex; flex-direction: column; gap: 2px; }

    .version-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .version-row:last-child { border-bottom: none; }

    .version-tag { font-size: 0.85rem; font-family: monospace; color: #334155; flex: 1; }
    .version-date { font-size: 0.78rem; color: #94a3b8; white-space: nowrap; }

    .download-btn {
      padding: 3px 10px;
      background: #1e3a5f;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      display: inline-block;
    }
    .download-btn:hover { background: #2d6a9f; }

    .card-footer { padding: 12px 16px; border-top: 1px solid #f1f5f9; }

    .instructions-btn {
      width: 100%;
      padding: 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      color: #475569;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .instructions-btn:hover { background: #f1f5f9; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: white;
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }

    .modal-content h1, .modal-content h2 { font-size: 1rem; margin: 16px 0 8px; color: #1e3a5f; }
    .modal-content h3 { font-size: 0.9rem; margin: 12px 0 6px; }
    .modal-content p  { font-size: 0.9rem; line-height: 1.7; color: #334155; margin-bottom: 8px; }
    .modal-content ol, .modal-content ul { padding-left: 20px; font-size: 0.9rem; line-height: 1.8; color: #334155; margin-bottom: 8px; }
    .modal-content code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }

    .modal-close {
      display: block;
      margin-top: 20px;
      padding: 8px 20px;
      background: #1e3a5f;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .modal-close:hover { background: #2d6a9f; }

    .empty { text-align: center; padding: 60px 20px; color: #94a3b8; grid-column: 1 / -1; }

    @media (max-width: 600px) {
      header { flex-wrap: wrap; }
      .search-wrap { max-width: 100%; width: 100%; }
      main { padding: 16px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>TPK Каталог</h1>
  <div class="search-wrap">
    <input id="search" type="text" placeholder="Поиск по названию...">
  </div>
</header>

<div class="filters">
  <button class="filter-btn active" data-type="all">Все</button>
  <button class="filter-btn" data-type="app">Приложения</button>
  <button class="filter-btn" data-type="plugin">Плагины</button>
  <button class="filter-btn" data-type="macro">Макросы</button>
</div>

<main>
  <div class="meta-bar" id="meta-bar"></div>
  <div class="grid" id="grid">
    <div class="empty">Загрузка...</div>
  </div>
</main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-content" id="modal-content"></div>
    <button class="modal-close" id="modal-close">Закрыть</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const TYPE_LABELS  = { app: 'Приложение', plugin: 'Плагин', macro: 'Макрос' };
  const TYPE_CLASSES = { app: 'type-app',   plugin: 'type-plugin', macro: 'type-macro' };

  let allProducts = [];
  let activeType  = 'all';
  let searchQuery = '';

  async function loadCatalog() {
    try {
      const r = await fetch('./catalog.json');
      const data = await r.json();
      allProducts = data.products || [];

      if (data.updatedAt) {
        const d = new Date(data.updatedAt);
        document.getElementById('meta-bar').textContent =
          'Обновлено: ' + d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      }
    } catch (e) {
      document.getElementById('grid').innerHTML = '<div class="empty">Не удалось загрузить каталог</div>';
      return;
    }
    render();
  }

  function render() {
    const query = searchQuery.toLowerCase();
    const filtered = allProducts.filter(p => {
      const matchType   = activeType === 'all' || p.type === activeType;
      const matchSearch = !query
        || p.name.toLowerCase().includes(query)
        || (p.description || '').toLowerCase().includes(query);
      return matchType && matchSearch;
    });

    const grid = document.getElementById('grid');
    grid.innerHTML = filtered.length
      ? filtered.map(cardHTML).join('')
      : '<div class="empty">Ничего не найдено</div>';
  }

  function cardHTML(p) {
    const badge = `<span class="type-badge ${TYPE_CLASSES[p.type] || 'type-app'}">${TYPE_LABELS[p.type] || p.type}</span>`;

    const img = p.image
      ? `<img class="card-image" src="${p.image}" alt="${p.name}"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    const placeholder = `<div class="card-image-placeholder" ${p.image ? 'style="display:none"' : ''}>&#128230;</div>`;

    const versionsHTML = (p.versions || []).map(v => {
      const links = (v.assets || []).map(a =>
        `<a class="download-btn" href="${a.downloadUrl}">${a.name}</a>`
      ).join(' ');
      return `<div class="version-row">
        <span class="version-tag">${v.version}</span>
        <span class="version-date">${v.releaseDate}</span>
        ${links}
      </div>`;
    }).join('');

    const footer = p.instructions
      ? `<div class="card-footer">
           <button class="instructions-btn" onclick="showInstructions('${p.id}')">
             📄 Инструкция по установке
           </button>
         </div>`
      : '';

    return `<div class="card">
      ${img}${placeholder}
      <div class="card-body">
        <div class="card-header">
          <div class="card-name">${p.name}</div>
          ${badge}
        </div>
        <div class="card-desc">${p.description || ''}</div>
        <div class="card-source">
          Источник: <a href="${p.sourceAccount}" target="_blank">
            ${p.sourceAccount.replace('https://github.com/', '')}
          </a>
        </div>
        <div class="versions-label">Версии</div>
        <div class="versions-list">${versionsHTML || '<span style="font-size:.85rem;color:#94a3b8">Нет версий</span>'}</div>
      </div>
      ${footer}
    </div>`;
  }

  function showInstructions(id) {
    const p = allProducts.find(x => x.id === id);
    if (!p) return;
    document.getElementById('modal-title').textContent = p.name + ' — Инструкция';
    document.getElementById('modal-content').innerHTML = marked.parse(p.instructions || '');
    document.getElementById('modal-overlay').classList.add('open');
  }

  document.getElementById('modal-close').addEventListener('click', () =>
    document.getElementById('modal-overlay').classList.remove('open'));

  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeType = btn.dataset.type;
      render();
    });
  });

  document.getElementById('search').addEventListener('input', e => {
    searchQuery = e.target.value;
    render();
  });

  loadCatalog();
</script>
</body>
</html>
